<!doctype html><html><head><meta charset="utf-8"><title>Ward Patients</title><style>
body{font-family:Arial;margin:30px;background:#f4f6f8}.bar,.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.bar{justify-content:space-between}button{background:#0b5ed7;color:#fff;border:0;padding:10px 14px;border-radius:6px;cursor:pointer}input{padding:10px;border:1px solid #bbb;border-radius:6px}.card{background:#fff;padding:18px;border-radius:10px;margin-top:16px}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #ddd;text-align:left}.escalated{background:#fff3cd;border-left:6px solid #dc3545}.message{padding:10px;margin-top:12px;border-radius:6px}.error{background:#fde8e8}.success{background:#e6f7ed}.warning{background:#fff3cd}.notice{font-size:12px;color:#666;margin-top:20px}</style></head><body>
<div class="bar"><h1>Ward Patient List</h1><div><button onclick="location.href='dashboard.html'">Dashboard</button> <button onclick="logout()">Logout</button></div></div>
<div class="card"><h2>Filter patients</h2><div class="controls"><input id="search" placeholder="Name, ID, bed or reason"><input id="ward" placeholder="Ward"><button onclick="loadPatients()">Apply filter</button><button onclick="clearFilter()">Clear</button></div></div>
<div class="card"><h2>Import patient CSV or JSON</h2><div class="controls"><input id="file" type="file" accept=".csv,.json"><button onclick="uploadFile()">Import</button></div><div id="importMessage"></div></div>
<div class="card"><div id="status">Loading...</div><table><thead><tr><th>ID</th><th>Name</th><th>Ward/Bed</th><th>Admission reason</th><th>Escalation</th></tr></thead><tbody id="rows"></tbody></table></div>
<div class="notice">Synthetic-data prototype. Verify all information using approved clinical systems and processes. This tool does not provide diagnosis, treatment or medication advice.</div>
<script>
const API='http://127.0.0.1:8000',token=localStorage.getItem('access_token');if(!token)location.href='index.html';
async function api(path,opt={}){const r=await fetch(API+path,{...opt,headers:{...(opt.headers||{}),Authorization:`Bearer ${token}`}});let d={};try{d=await r.json()}catch{}if(r.status===401){localStorage.removeItem('access_token');location.href='index.html'}if(!r.ok)throw new Error(typeof d.detail==='string'?d.detail:JSON.stringify(d.detail));return d}
async function loadPatients(){const s=encodeURIComponent(document.getElementById('search').value),w=encodeURIComponent(document.getElementById('ward').value);try{const p=await api(`/patients?search=${s}&ward=${w}`);document.getElementById('status').textContent=p.length?`${p.length} patient(s) found.`:'No patients match the filter.';document.getElementById('rows').innerHTML=p.map(x=>`<tr class="${x.escalated?'escalated':''}" onclick="location.href='patient.html?patient=${encodeURIComponent(x.patient_id)}'"><td>${x.patient_id}</td><td>${x.display_name}</td><td>${x.ward} / ${x.bed}</td><td>${x.admission_reason}</td><td>${x.alerts.length?x.alerts.map(a=>`${a.rule_id}: ${a.message}<br><small>${a.observed_at}</small>`).join('<hr>'):'None'}</td></tr>`).join('')}catch(e){document.getElementById('status').textContent=e.message}}
function clearFilter(){search.value='';ward.value='';loadPatients()}
async function uploadFile(){const box=document.getElementById('importMessage'),f=document.getElementById('file').files[0];if(!f){box.className='message warning';box.textContent='Choose a CSV or JSON file.';return}const form=new FormData();form.append('file',f);try{const d=await api('/imports/patients',{method:'POST',body:form});box.className='message success';box.textContent=`${d.message} ${d.imported} record(s).`;loadPatients()}catch(e){box.className='message error';box.textContent=e.message}}
async function logout(){try{await api('/logout',{method:'POST'})}catch{}localStorage.removeItem('access_token');location.href='index.html'}loadPatients();
</script></body></html>
